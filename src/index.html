<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Gallery">
  <title>Gallery</title>

  <!-- Social / search metadata. og:image (og.jpg) is generated from src/hero.webp
       at build time; scrapers do not reliably render WebP, hence the JPEG. -->
  <link rel="canonical" href="https://joeyparrish.github.io/gallery/">
  <meta name="description" content="A gallery of artwork by Joey Parrish.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gallery">
  <meta property="og:description" content="A gallery of artwork by Joey Parrish.">
  <meta property="og:url" content="https://joeyparrish.github.io/gallery/">
  <meta property="og:image" content="https://joeyparrish.github.io/gallery/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A gilt-framed oil painting of a shamed Meowth at a formal dinner, hung on the gallery's dark wall.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://joeyparrish.github.io/gallery/og.jpg">

  <!-- Structured data describing each work for search engines, baked in at build
       time from gallery.yaml (including per-work descriptions). Not shown to viewers. -->
  <script type="application/ld+json">/*JSONLD*/</script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L18P7Y992N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Hash routing never reloads the page; app.js sends a page_view per route,
    // so disable the automatic one here to avoid double-counting the landing view.
    gtag('config', 'G-L18P7Y992N', { send_page_view: false });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">
  </noscript>
  <style>/*STYLE*/</style>
</head>
<body>
  <h1 class="sr-only">Gallery</h1>

  <main id="grid" class="grid" aria-label="Works"><!--WORKS--></main>

  <footer class="site-footer">© 2026 Joey Parrish</footer>

  <!--VIEWER-->

  <!-- The full manifest, baked in at build time so the viewer needs no fetch. -->
  <script type="application/json" id="gallery-manifest">/*MANIFEST*/</script>
  <script src="app.js" type="module"></script>
</body>
</html>
